name: Wöchentliche Nachrichtensammlung
on:
  schedule:
    - cron: '17 4 * * 1' # Montag 04:17 UTC = 05:17 MEZ / 06:17 MESZ
  workflow_dispatch:
    inputs:
      review_limit:
        description: Maximale Anzahl neu zu prüfender Volltexte
        default: '40'
        type: string
permissions:
  contents: read
concurrency:
  group: weekly-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NEWS_DB: ${{ github.workspace }}/var/news.sqlite
      NEWS_SSH_HOST: ${{ secrets.NEWS_SSH_HOST }}
      NEWS_REMOTE_PATH: ${{ secrets.NEWS_REMOTE_PATH }}
      NEWS_SSH_KEY: ${{ secrets.NEWS_SSH_KEY }}
      NEWS_KNOWN_HOSTS: ${{ secrets.NEWS_KNOWN_HOSTS }}
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_MODELS: ${{ github.workspace }}/.models
      NEWS_MODEL: qwen3:4b
    steps:
      - uses: actions/checkout@v4
      - name: Konfiguration prüfen
        run: |
          test -n "$NEWS_SSH_HOST" && test -n "$NEWS_REMOTE_PATH" && test -n "$NEWS_SSH_KEY" && test -n "$NEWS_KNOWN_HOSTS" || { echo 'Webserver-Zugang fehlt. Siehe README.'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Laufzeit installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-xml php-mbstring php-curl
          python -m pip install -r requirements.txt
          mkdir -p var
      - name: Tests
        run: |
          php tests/run.php
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Artikelbestand vom Webserver lesen
        run: python scripts/sync.py fetch
      - name: Quellen einsammeln
        id: collect
        continue-on-error: true
        run: php bin/collect.php
      - name: Originaladressen auflösen und Volltexte abrufen
        run: python scripts/fulltexts.py "$NEWS_DB" 0
      - uses: actions/cache@v4
        with:
          path: .models
          key: ollama-qwen3-4b-v1
      - name: Offenes Modell ausschließlich auf dem Runner starten
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh -o "$RUNNER_TEMP/install-ollama.sh"
          OLLAMA_VERSION=0.40.13 sh "$RUNNER_TEMP/install-ollama.sh"
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS "$OLLAMA_URL/api/tags" >/dev/null && break; sleep 2; done
          ollama pull "$NEWS_MODEL"
      - name: Schwerpunkt anhand vollständiger Texte prüfen
        env:
          REVIEW_LIMIT: ${{ inputs.review_limit || '40' }}
        run: python scripts/review.py --db "$NEWS_DB" --limit "$REVIEW_LIMIT"
      - name: Ergebnisse in Live-Datenbank übernehmen
        run: python scripts/sync.py push
      - name: Laufbericht
        if: always()
        run: |
          echo '## Nachrichtensammlung' >> "$GITHUB_STEP_SUMMARY"
          echo 'Das Modell lief auf dem GitHub-Runner; die Webseite benötigt weder Modell noch API-Token.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Nicht zugängliche Volltexte und noch nicht geprüfte Artikel bleiben vorläufig. Öffentliche Kategorieänderungen auf dem Webserver werden beim Import nicht überschrieben.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Quellenabruf: ${{ steps.collect.outcome }}' >> "$GITHUB_STEP_SUMMARY"
