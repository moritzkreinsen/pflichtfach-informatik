name: Wöchentliche Nachrichtensammlung
on:
  schedule:
    - cron: '17 4 * * 1' # Montag 05:17 MEZ / 06:17 MESZ
  workflow_dispatch:
    inputs:
      review_limit:
        description: Maximale Anzahl zu prüfender Volltexte
        default: '40'
        type: string
permissions:
  contents: read
concurrency:
  group: weekly-news
  cancel-in-progress: false
jobs:
  update:
    if: vars.ENABLE_NEWS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
    env:
      NEWS_DB: ${{ github.workspace }}/var/collection.sqlite
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_MODELS: ${{ github.workspace }}/.models
      NEWS_MODEL: qwen3:4b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Laufzeit installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-xml php-mbstring php-curl
          python -m pip install -r requirements.txt
          mkdir -p var
      - name: Tests
        run: |
          php tests/run.php
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Versionierten Nachrichtenbestand laden
        run: php bin/import.php < data/articles.json
      - name: Quellen einsammeln
        id: collect
        continue-on-error: true
        run: php bin/collect.php
      - name: Originaladressen auflösen und Volltexte abrufen
        run: python scripts/fulltexts.py "$NEWS_DB" 0
      - uses: actions/cache@v4
        with:
          path: .models
          key: ollama-qwen3-4b-v1
      - name: Offenes Modell ausschließlich auf dem Runner starten
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh -o "$RUNNER_TEMP/install-ollama.sh"
          OLLAMA_VERSION=0.40.13 sh "$RUNNER_TEMP/install-ollama.sh"
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS "$OLLAMA_URL/api/tags" >/dev/null && break; sleep 2; done
          ollama pull "$NEWS_MODEL"
      - name: Schwerpunkt anhand vollständiger Texte prüfen
        env:
          REVIEW_LIMIT: ${{ inputs.review_limit || '40' }}
        run: python scripts/review.py --db "$NEWS_DB" --limit "$REVIEW_LIMIT"
      - name: Nachrichtenmetadaten exportieren und prüfen
        run: |
          python scripts/news_data.py export --db "$NEWS_DB"
          python scripts/news_data.py validate
          python scripts/build_static.py
      - name: Daten-PR zur Prüfung erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/open_data_pr.py news
      - name: Laufbericht
        if: always()
        run: |
          echo 'Nachrichtensammlung: ${{ steps.collect.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Nur Metadaten werden vorgeschlagen. Nach manuellem Merge veröffentlicht Pages den neuen Bestand. Modell und Volltextcache verbleiben auf dem Runner.' >> "$GITHUB_STEP_SUMMARY"
